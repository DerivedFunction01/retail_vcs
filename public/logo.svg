  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <path d="M 80 120 C 190 120, 190 256, 256 256" fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 80 392 C 190 392, 190 256, 256 256" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

  <path d="M 256 256 L 432 256" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.4"/>

  <circle cx="80" cy="120" r="26" fill="#34D399" filter="url(#glow)"/>
  <circle cx="80" cy="392" r="26" fill="#FBBF24" filter="url(#glow)"/>

  <circle cx="256" cy="256" r="46" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" filter="url(#glow)"/>

  <circle cx="432" cy="256" r="22" fill="#FFFFFF" fill-opacity="0.6" filter="url(#glow)"/>
