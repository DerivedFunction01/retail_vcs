<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1a14"/>
      <stop offset="100%" stop-color="#080d0a"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="emeraldGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="bagStroke" x1="166" y1="260" x2="346" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowEmerald" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.063
                0 0 0 0 0.725
                0 0 0 0 0.506
                0 0 0 0.7 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.961
                0 0 0 0 0.620
                0 0 0 0 0.043
                0 0 0 0.7 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>

    <filter id="bagShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.6" fill="#10B981" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- Dot grid texture -->
  <rect x="56" y="56" width="400" height="400" rx="52" fill="url(#dotGrid)"/>

  <!-- ===== AMBIENT GLOW ===== -->
  <ellipse cx="180" cy="120" rx="100" ry="80" fill="#10B981" opacity="0.04" filter="url(#glowSoft)"/>
  <ellipse cx="332" cy="120" rx="80" ry="70" fill="#F59E0B" opacity="0.03" filter="url(#glowSoft)"/>
  <ellipse cx="256" cy="340" rx="110" ry="80" fill="#10B981" opacity="0.03" filter="url(#glowSoft)"/>

  <!-- ===== SHOPPING BAG BODY ===== -->
  <rect x="166" y="262" width="180" height="178" rx="22"
        fill="#10B981" fill-opacity="0.05"
        stroke="url(#bagStroke)" stroke-width="3"
        filter="url(#bagShadow)"/>

  <!-- Bag content lines (suggesting items/list) -->
  <line x1="192" y1="310" x2="320" y2="310" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>
  <line x1="192" y1="338" x2="320" y2="338" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>
  <line x1="192" y1="366" x2="320" y2="366" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>
  <line x1="192" y1="394" x2="320" y2="394" stroke="#10B981" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>

  <!-- Small diamond on bag (merge/commit marker) -->
  <polygon points="256,324 264,334 256,344 248,334" fill="#10B981" fill-opacity="0.25"/>

  <!-- ===== HANDLE CONNECTOR AT BAG OPENING ===== -->
  <!-- Short vertical stem from bag top to fork point -->
  <line x1="256" y1="262" x2="256" y2="238" stroke="#10B981" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== FORK POINT DIAMOND ===== -->
  <polygon points="256,226 265,236 256,246 247,236"
           fill="#10B981" fill-opacity="0.5"
           stroke="#10B981" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- ===== LEFT BRANCH (Main Branch - Emerald) ===== -->
  <!-- Left half of handle: bag edge curves to fork region -->
  <path d="M 210 262 C 208 250, 230 240, 252 237"
        fill="none" stroke="#10B981" stroke-width="4.5" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Left branch line: fork point up-left to commit node -->
  <path d="M 250 232 C 236 190, 178 140, 150 96"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Left commit node - outer ring -->
  <circle cx="148" cy="92" r="22" fill="#0f1a14" stroke="#10B981" stroke-width="3.5" stroke-opacity="0.6"/>
  <!-- Left commit node - inner dot -->
  <circle cx="148" cy="92" r="9" fill="url(#emeraldGrad)" filter="url(#glowEmerald)"/>

  <!-- ===== RIGHT BRANCH (Feature Branch - Amber) ===== -->
  <!-- Right half of handle: bag edge curves to fork region -->
  <path d="M 302 262 C 304 250, 282 240, 260 237"
        fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Right branch line: fork point up-right to commit node -->
  <path d="M 262 232 C 276 190, 334 140, 362 96"
        fill="none" stroke="url(#amberGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Right commit node - outer ring -->
  <circle cx="364" cy="92" r="22" fill="#0f1a14" stroke="#F59E0B" stroke-width="3.5" stroke-opacity="0.6"/>
  <!-- Right commit node - inner dot -->
  <circle cx="364" cy="92" r="9" fill="url(#amberGrad)" filter="url(#glowAmber)"/>

  <!-- ===== DECORATIVE: Small secondary nodes on branches ===== -->
  <!-- Small dot on left branch midpoint -->
  <circle cx="200" cy="166" r="3.5" fill="#10B981" fill-opacity="0.4"/>
  <!-- Small dot on right branch midpoint -->
  <circle cx="312" cy="166" r="3.5" fill="#F59E0B" fill-opacity="0.35"/>

  <!-- ===== DECORATIVE: Subtle horizontal line at bag top (opening) ===== -->
  <line x1="190" y1="262" x2="322" y2="262" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>
</svg>
